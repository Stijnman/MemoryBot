name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py_compile_safe || true

      - name: Compile application
        run: python -m py_compile memorybot.py

      - name: Validate imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('memorybot.py').read_text(encoding='utf-8'))
          print('memorybot.py parses successfully')
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint
        run: npm install -g markdownlint-cli2
      - name: Lint documentation
        run: markdownlint-cli2 --config .markdownlint.json '**/*.md' '#.git'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run pre-commit
        run: |
          pip install pre-commit
          npm install -g markdownlint-cli2
          pre-commit run --all-files --show-diff-on-failure
