name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Reject committed secrets
        run: |
          python - <<'PY'
          import pathlib, re
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'sk-[A-Za-z0-9]{30,}'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
          ]
          hits=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: text=p.read_text(errors='ignore')
              except OSError: continue
              if any(rx.search(text) for rx in patterns): hits.append(str(p))
          if hits: raise SystemExit('Potential committed secrets: ' + ', '.join(hits))
          print('No high-confidence secret patterns found')
          PY
